<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marathon Spectator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 16px; font-family: system-ui, -apple-system, sans-serif; }

    .phone-frame { width: 100%; max-width: 360px; margin: 0 auto; background: #1a1a1a; border-radius: 32px; padding: 10px; border: 0.5px solid #333; }
    .phone-screen { background: #b8dcf0; border-radius: 24px; overflow: hidden; position: relative; }
    .notch { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 90px; height: 22px; background: #1a1a1a; border-radius: 14px; z-index: 50; }

    /* ── Stage ── */
    .stage { position: relative; width: 100%; height: 360px; overflow: hidden;
      background: linear-gradient(180deg, #b8dcf0 0%, #d4e9f7 40%, #d4e9f7 55%, #c8b896 55%, #b5a382 100%); }
    .sky-layer { position: absolute; top: 0; left: 0; right: 0; height: 55%; pointer-events: none; }
    .cloud { position: absolute; opacity: 0.85; }
    .blimp { position: absolute; pointer-events: none; z-index: 2; }
    .skyline { position: absolute; bottom: 45%; left: 0; right: 0; height: 60px; pointer-events: none; z-index: 1; opacity: 0.85; }
    .road { position: absolute; bottom: 0; left: 0; right: 0; height: 45%; background: #5a5550; z-index: 2; }
    .road::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 3px;
      background: repeating-linear-gradient(90deg, #f4d35e 0 16px, transparent 16px 32px); transform: translateY(-50%); }

    /* ── Crowd ── */
    .crowd-line { position: absolute; bottom: 45%; left: 0; right: 0; height: 38px;
      display: flex; gap: 2px; padding: 0 6px; align-items: flex-end; z-index: 3; }
    .spec { width: 11px; position: relative; border-radius: 50% 50% 30% 30%; opacity: 0.95; transition: transform 0.2s; flex-shrink: 0; }
    .spec.cheering { transform: translateY(-3px) scale(1.1); }
    .spec.gasping   { transform: translateY(-2px) scale(1.15); filter: brightness(1.2); }

    /* Posters held above heads */
    .poster { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      width: 22px; height: 16px; background: #fff; border: 0.5px solid #5a5550; border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      font-size: 6px; font-weight: 700; line-height: 1.05; padding: 1px; text-align: center;
      color: #1a1a1a; z-index: 4; pointer-events: none; }
    .poster::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
      width: 1px; height: 6px; background: #5a3a20; }

    /* ── Railing ── */
    .railing { position: absolute; bottom: 44%; left: 0; right: 0; height: 8px; z-index: 4; pointer-events: none; }
    .railing-top    { position: absolute; top: 0;  left: 0; right: 0; height: 1.5px; background: #c0c0c8; }
    .railing-bottom { position: absolute; top: 6px; left: 0; right: 0; height: 1.5px; background: #a0a0a8; }
    .railing-posts  { position: absolute; top: 0; left: 0; right: 0; height: 8px;
      background-image: repeating-linear-gradient(90deg, #6a6a72 0 1.5px, transparent 1.5px 24px); }

    /* ── Sponsor ad banners draped over railing ── */
    .ad-banners { position: absolute; bottom: 43.2%; left: 0; right: 0; height: 16px; z-index: 4;
      pointer-events: none; display: flex; gap: 4px; padding: 0 4px; }
    .ad-banner { flex: 1; min-width: 0; height: 14px; border-radius: 1.5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 7px; font-weight: 800; letter-spacing: 0.3px; text-transform: uppercase;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15); position: relative; overflow: hidden; }
    .ad-banner::before { content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 50%, rgba(0,0,0,0.1) 100%); }
    .ad-banner:nth-child(odd)  { transform: skewY(-1.2deg); }
    .ad-banner:nth-child(even) { transform: skewY(1.2deg); }
    .ad-banner::after { content: ''; position: absolute; top: 1px; left: 2px;
      width: 1.5px; height: 1.5px; background: #444; border-radius: 50%;
      box-shadow: calc(100% - 4px) 0 0 #444; }

    /* ── Spec bubbles ── */
    .spec-bubble { position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
      background: #fff; border: 0.5px solid #b3aea2; border-radius: 8px;
      padding: 2px 5px; font-size: 9px; white-space: nowrap;
      animation: pop 1.8s ease forwards; pointer-events: none; z-index: 6; color: #141414; }
    .spec-bubble.named   { background: #EEEDFE; border-color: #7F77DD; color: #26215C; font-weight: 500; }
    .spec-bubble.concern { background: #FAEEDA; border-color: #BA7517; color: #633806; }

    /* ── Runners ── */
    .runner { position: absolute; bottom: 8%; width: 46px; height: 75px;
      transition: transform 0.3s; cursor: pointer; z-index: 5; }
    .runner.wheelchair { width: 56px; height: 60px; }
    .runner:active { transform: translateY(-3px) scale(1.05); }
    .runner.flipped svg         { transform: scaleX(-1); }
    .runner.fallen svg          { transform: rotate(-75deg) translateY(15px); }
    .runner.fallen.flipped svg  { transform: rotate(75deg) scaleX(-1) translateY(15px); }
    .runner.bumped svg          { animation: bumpShake 0.5s ease; }
    @keyframes bumpShake {
      0%,100% { transform: translateX(0); }
      25%     { transform: translateX(-3px) rotate(-5deg); }
      75%     { transform: translateX(3px)  rotate(5deg); }
    }

    /* ── Reaction bubbles ── */
    .reaction-bubble { position: absolute; bottom: 105%; left: 50%; transform: translateX(-50%);
      background: #fff; border: 0.5px solid #b3aea2; border-radius: 8px;
      padding: 3px 8px; font-size: 11px; white-space: nowrap;
      animation: pop 2.4s ease forwards; pointer-events: none; z-index: 10; color: #141414; }
    .reaction-bubble.flipped  { transform: translateX(-50%) scaleX(-1) !important; }
    .reaction-bubble.shout    { background: #FAEEDA; border-color: #BA7517; color: #633806; font-weight: 500; }
    .reaction-bubble.confused { background: #E6F1FB; border-color: #185FA5; color: #042C53; }
    .reaction-bubble.danger   { background: #FCEBEB; border-color: #A32D2D; color: #501313; font-weight: 500; }
    @keyframes pop {
      0%   { opacity: 0; transform: translateX(-50%) translateY(8px)  scale(0.8); }
      15%  { opacity: 1; transform: translateX(-50%) translateY(0)     scale(1);   }
      85%  { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) translateY(-6px); }
    }

    /* ── Floating items / impacts / peels ── */
    .floating-item { position: absolute; font-size: 18px; pointer-events: none;
      animation: toss 1.4s ease-out forwards; z-index: 8; }
    @keyframes toss {
      0%   { opacity: 0; transform: translate(0,0) rotate(0); }
      20%  { opacity: 1; }
      100% { opacity: 0.3; transform: translate(var(--tx),var(--ty)) rotate(360deg); }
    }
    .impact-burst { position: absolute; font-size: 18px; pointer-events: none; z-index: 11;
      animation: burst 0.7s ease-out forwards; font-weight: bold; }
    @keyframes burst {
      0%   { opacity: 0; transform: scale(0.3) rotate(0); }
      30%  { opacity: 1; transform: scale(1.4) rotate(15deg); }
      100% { opacity: 0; transform: scale(1.6) rotate(-15deg) translateY(-10px); }
    }
    .peel { position: absolute; bottom: 6%; font-size: 18px; pointer-events: none; z-index: 4; }

    /* ── Staff ── */
    .paramedic { position: absolute; bottom: 8%; width: 40px; height: 68px; z-index: 9; }

    /* ── Overlays ── */
    .me-marker { position: absolute; bottom: 47%; left: 50%; transform: translateX(-50%); z-index: 7; }
    .me-label { font-size: 9px; background: #fff; padding: 1px 5px; border-radius: 8px;
      border: 0.5px solid #b3aea2; color: #141414; }
    .top-bar { position: absolute; top: 36px; left: 10px; right: 10px;
      display: flex; justify-content: space-between; z-index: 6; }
    .pill { background: #fff; padding: 4px 10px; border-radius: 999px;
      border: 0.5px solid #b3aea2; font-size: 11px; font-weight: 500; color: #141414; }
    .pill.btn { cursor: pointer; user-select: none; }
    .pill.btn:active { background: #f0ede6; }

    /* ── UI chrome below stage ── */
    .hint-bar { background: #f6f4ee; padding: 6px 12px; font-size: 11px;
      color: #6e6a5e; text-align: center; min-height: 28px;
      border-top: 0.5px solid #ddd8cc; }
    .action-grid { background: #fff; padding: 12px;
      display: grid; grid-template-columns: repeat(4,1fr); gap: 8px;
      border-top: 0.5px solid #e8e4dc; }
    .action-btn { aspect-ratio: 1; background: #f6f4ee; border: 0.5px solid #d8d4c6;
      border-radius: 8px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      cursor: pointer; user-select: none; padding: 4px; transition: transform 0.1s; }
    .action-btn:active { transform: scale(0.94); }
    .action-btn .ico { font-size: 20px; line-height: 1; }
    .action-btn .lbl { font-size: 10px; color: #141414; line-height: 1.1; text-align: center; }
    .action-btn.danger  { background: #FCEBEB; border-color: #F09595; }
    .action-btn.warn    { background: #FAEEDA; border-color: #EF9F27; }
    .action-btn.success { background: #E1F5EE; border-color: #5DCAA5; }
    .action-btn.info    { background: #E6F1FB; border-color: #85B7EB; }
    .stat-strip { background: #fff; padding: 8px;
      display: flex; justify-content: space-around; gap: 2px;
      border-top: 0.5px solid #e8e4dc; }
    .stat-cell { text-align: center; flex: 1; min-width: 0; }
    .stat-num { font-size: 14px; font-weight: 500; color: #141414; line-height: 1; }
    .stat-lbl { font-size: 9px; color: #6e6a5e; margin-top: 2px; }
  </style>
</head>
<body>
<div class="phone-frame">
  <div class="phone-screen">
    <div class="notch"></div>
    <div class="stage" id="stage">
      <div class="sky-layer" id="sky"></div>
      <svg class="skyline" viewBox="0 0 380 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0"   y="20" width="30" height="40" fill="#a8b5c2"/>
        <rect x="30"  y="10" width="28" height="50" fill="#9aa8b8"/>
        <rect x="58"  y="25" width="38" height="35" fill="#b0bbc7"/>
        <rect x="96"  y="5"  width="30" height="55" fill="#8e9caf"/>
        <rect x="126" y="18" width="35" height="42" fill="#a3b0bf"/>
        <rect x="161" y="2"  width="24" height="58" fill="#8597ab"/>
        <rect x="185" y="14" width="40" height="46" fill="#9eacbc"/>
        <rect x="225" y="26" width="32" height="34" fill="#aebac6"/>
        <rect x="257" y="8"  width="28" height="52" fill="#8c9bae"/>
        <rect x="285" y="20" width="36" height="40" fill="#a0adbe"/>
        <rect x="321" y="12" width="30" height="48" fill="#94a3b6"/>
        <rect x="351" y="25" width="29" height="35" fill="#abb7c4"/>
      </svg>
      <div class="crowd-line" id="crowd"></div>
      <div class="railing">
        <div class="railing-top"></div>
        <div class="railing-posts"></div>
        <div class="railing-bottom"></div>
      </div>
      <div class="ad-banners" id="ads"></div>
      <div class="road"></div>
      <div class="me-marker"><div class="me-label">you</div></div>
      <div class="top-bar">
        <div class="pill btn" id="audio-toggle">🔇 mute</div>
        <div class="pill">mile <span id="mile">0</span>/26</div>
      </div>
    </div>

    <div class="hint-bar" id="hint">tap a runner, then pick an action</div>

    <div class="action-grid">
      <div class="action-btn info"    onclick="doAction('water')">    <div class="ico">💧</div><div class="lbl">water</div></div>
      <div class="action-btn warn"    onclick="doAction('banana')">   <div class="ico">🍌</div><div class="lbl">banana</div></div>
      <div class="action-btn warn"    onclick="doAction('gel')">      <div class="ico">⚡</div><div class="lbl">gel</div></div>
      <div class="action-btn"         onclick="doAction('cowbell')">  <div class="ico">🔔</div><div class="lbl">cowbell</div></div>
      <div class="action-btn success" onclick="doAction('cheer')">    <div class="ico">👏</div><div class="lbl">cheer</div></div>
      <div class="action-btn success" onclick="doAction('compliment')"><div class="ico">😊</div><div class="lbl">nice</div></div>
      <div class="action-btn danger"  onclick="doAction('insult')">   <div class="ico">😈</div><div class="lbl">trash talk</div></div>
      <div class="action-btn danger"  onclick="doAction('confuse')">  <div class="ico">❓</div><div class="lbl">wrong way</div></div>
    </div>

    <div class="stat-strip">
      <div class="stat-cell"><div class="stat-num" id="stat-helped">0</div><div class="stat-lbl">helped</div></div>
      <div class="stat-cell"><div class="stat-num" id="stat-stop">0</div><div class="stat-lbl">stops</div></div>
      <div class="stat-cell"><div class="stat-num" id="stat-turned">0</div><div class="stat-lbl">turned</div></div>
      <div class="stat-cell"><div class="stat-num" id="stat-slip">0</div><div class="stat-lbl">slips</div></div>
      <div class="stat-cell"><div class="stat-num" id="stat-bump">0</div><div class="stat-lbl">bumps</div></div>
    </div>
  </div>
</div>

<script type="module" src="/src/game.js"></script>
</body>
</html>
